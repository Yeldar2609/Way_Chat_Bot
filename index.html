<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayland Academy Assistant</title>
    <style>
        /* ===== WAYLAND CHATBOT WIDGET - SCOPED STYLES ===== */
        /* All classes namespaced with wa-chatbot- prefix for safe embedding */

        :root {
            --wa-primary-red: #B4232A;
            --wa-primary-red-dark: #8F151B;
            --wa-accent-red: #C93B3F;
            --wa-warm-bg: #F8F3F1;
            --wa-cream-banner: #FFF3D6;
            --wa-text-primary: #1F2937;
            --wa-text-muted: #6B7280;
            --wa-success-green: #15803D;
            --wa-border-soft: #E7D8D8;
            --wa-white: #FFFFFF;
            --wa-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --wa-shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --wa-shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        /* Prevent global style pollution */
        .wa-chatbot-root * {
            box-sizing: border-box;
        }

        /* ===== LAUNCHER BUTTON ===== */
        .wa-chatbot-launcher {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .wa-chatbot-launcher-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--wa-primary-red) 0%, var(--wa-accent-red) 100%);
            border: none;
            color: var(--wa-white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--wa-shadow-lg);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 28px;
            position: relative;
        }

        .wa-chatbot-launcher-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 35px rgba(180, 35, 42, 0.25);
        }

        .wa-chatbot-launcher-btn:active {
            transform: scale(0.95);
        }

        .wa-chatbot-launcher-btn:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(180, 35, 42, 0.2), var(--wa-shadow-lg);
        }

        .wa-chatbot-launcher-btn::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--wa-success-green);
            border: 3px solid var(--wa-white);
            border-radius: 50%;
            bottom: -2px;
            right: -2px;
            animation: wa-pulse 2s infinite;
        }

        @keyframes wa-pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.15);
            }
        }

        .wa-chatbot-launcher-label {
            position: absolute;
            bottom: 70px;
            right: 0;
            background: var(--wa-white);
            color: var(--wa-text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: var(--wa-shadow-md);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .wa-chatbot-launcher-btn:hover ~ .wa-chatbot-launcher-label {
            opacity: 1;
        }

        /* ===== WIDGET PANEL ===== */
        .wa-chatbot-widget {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999998;
            width: 391px;
            max-height: 483px;
            background: var(--wa-white);
            border-radius: 12px;
            box-shadow: var(--wa-shadow-lg);
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            opacity: 0;
            transform: scale(0.15) translateY(40px);
            transform-origin: bottom right;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .wa-chatbot-widget.wa-chatbot-open {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* ===== WIDGET HEADER ===== */
        .wa-chatbot-header {
            background: linear-gradient(135deg, var(--wa-primary-red) 0%, var(--wa-accent-red) 100%);
            color: var(--wa-white);
            padding: 16px;
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .wa-chatbot-header-left {
            flex: 1;
            min-width: 200px;
        }

        .wa-chatbot-title {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            margin-bottom: 2px;
        }

        .wa-chatbot-subtitle {
            font-size: 12px;
            opacity: 0.95;
            margin: 0;
        }

        .wa-chatbot-header-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .wa-chatbot-badge {
            background: rgba(255, 255, 255, 0.25);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }

        .wa-chatbot-kill-btn {
            background: rgba(255, 255, 255, 0.2);
            color: var(--wa-white);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .wa-chatbot-kill-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .wa-chatbot-kill-btn:focus {
            outline: none;
            box-shadow: inset 0 0 0 2px var(--wa-white);
        }

        /* ===== WARNING BANNER ===== */
        .wa-chatbot-warning {
            background: var(--wa-cream-banner);
            color: #92400e;
            padding: 10px 14px;
            font-size: 12px;
            text-align: center;
            border-bottom: 1px solid #fbbf24;
            line-height: 1.4;
        }

        /* ===== MESSAGES AREA ===== */
        .wa-chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            background: var(--wa-warm-bg);
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            max-height: 184px;
        }

        .wa-chatbot-messages::-webkit-scrollbar {
            width: 6px;
        }

        .wa-chatbot-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .wa-chatbot-messages::-webkit-scrollbar-thumb {
            background: var(--wa-border-soft);
            border-radius: 3px;
        }

        .wa-chatbot-message {
            display: flex;
            gap: 8px;
            animation: wa-fadeIn 0.3s ease-in;
        }

        @keyframes wa-fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .wa-chatbot-message-bot {
            align-self: flex-start;
        }

        .wa-chatbot-message-user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .wa-chatbot-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            flex-shrink: 0;
        }

        .wa-chatbot-avatar img,
        .wa-chatbot-launcher-btn img {
            pointer-events: none;
        }

        .wa-chatbot-message-bot .wa-chatbot-avatar {
            background: linear-gradient(135deg, var(--wa-primary-red) 0%, var(--wa-accent-red) 100%);
            color: var(--wa-white);
        }

        .wa-chatbot-message-user .wa-chatbot-avatar {
            background: #9CA3AF;
            color: var(--wa-white);
            font-size: 18px;
        }

        .wa-chatbot-message-content {
            max-width: 70%;
            min-width: 60px;
        }

        .wa-chatbot-message-bubble {
            padding: 10px 12px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 13px;
            word-wrap: break-word;
        }

        .wa-chatbot-message-bot .wa-chatbot-message-bubble {
            background: var(--wa-white);
            color: var(--wa-text-primary);
            border: 1px solid var(--wa-border-soft);
        }

        .wa-chatbot-message-user .wa-chatbot-message-bubble {
            background: var(--wa-primary-red);
            color: var(--wa-white);
        }

        .wa-chatbot-message-time {
            font-size: 11px;
            color: var(--wa-text-muted);
            margin-top: 4px;
            padding: 0 2px;
        }

        .wa-chatbot-message-user .wa-chatbot-message-time {
            text-align: right;
        }

        /* ===== SUGGESTIONS ===== */
        .wa-chatbot-suggestions {
            padding: 8px 12px;
            background: var(--wa-warm-bg);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            border-bottom: 1px solid var(--wa-border-soft);
        }

        .wa-chatbot-suggestion-chip {
            background: var(--wa-white);
            border: 1px solid var(--wa-border-soft);
            color: var(--wa-text-primary);
            padding: 6px 10px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .wa-chatbot-suggestion-chip:hover {
            background: var(--wa-primary-red);
            color: var(--wa-white);
            border-color: var(--wa-primary-red);
            transform: translateY(-1px);
        }

        .wa-chatbot-suggestion-chip:focus {
            outline: none;
            box-shadow: inset 0 0 0 2px var(--wa-primary-red);
        }

        /* ===== INPUT AREA ===== */
        .wa-chatbot-input-area {
            padding: 12px;
            background: var(--wa-white);
            border-top: 1px solid var(--wa-border-soft);
            border-radius: 0 0 12px 12px;
        }

        .wa-chatbot-input-wrapper {
            display: flex;
            gap: 8px;
        }

        .wa-chatbot-input {
            flex: 1;
            padding: 8px 12px;
            border: 1.5px solid var(--wa-border-soft);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .wa-chatbot-input:focus {
            outline: none;
            border-color: var(--wa-primary-red);
            box-shadow: 0 0 0 3px rgba(180, 35, 42, 0.1);
        }

        .wa-chatbot-send-btn {
            background: linear-gradient(135deg, var(--wa-primary-red) 0%, var(--wa-accent-red) 100%);
            color: var(--wa-white);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .wa-chatbot-send-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--wa-shadow-md);
        }

        .wa-chatbot-send-btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(180, 35, 42, 0.2);
        }

        .wa-chatbot-send-btn:disabled {
            background: var(--wa-text-muted);
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* ===== FOOTER ===== */
        .wa-chatbot-footer {
            background: var(--wa-warm-bg);
            padding: 10px 12px;
            text-align: center;
            font-size: 11px;
            color: var(--wa-text-muted);
            border-radius: 0 0 12px 12px;
            border-top: 1px solid var(--wa-border-soft);
        }

        .wa-chatbot-footer a {
            color: var(--wa-primary-red);
            text-decoration: none;
        }

        .wa-chatbot-footer a:hover {
            text-decoration: underline;
        }

        /* ===== DISABLED STATE ===== */
        .wa-chatbot-disabled-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(248, 243, 241, 0.85);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .wa-chatbot-widget.wa-chatbot-disabled .wa-chatbot-disabled-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .wa-chatbot-disabled-text {
            background: var(--wa-white);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            box-shadow: var(--wa-shadow-md);
            border: 1px solid var(--wa-border-soft);
        }

        .wa-chatbot-disabled-text p {
            margin: 0;
            font-size: 12px;
            color: var(--wa-text-primary);
            font-weight: 500;
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 768px) {
            .wa-chatbot-widget {
                width: calc(100% - 32px);
                bottom: 96px;
                right: 16px;
                left: 16px;
                max-width: none;
            }

            .wa-chatbot-launcher {
                bottom: 16px;
                right: 16px;
            }

            .wa-chatbot-message-content {
                max-width: 80%;
            }

            .wa-chatbot-suggestion-chip {
                font-size: 11px;
                padding: 5px 9px;
            }
        }

        @media (max-width: 480px) {
            .wa-chatbot-launcher-label {
                display: none;
            }

            .wa-chatbot-widget {
                width: 100%;
                bottom: 0;
                right: 0;
                left: 0;
                max-height: calc(100vh - 80px);
                border-radius: 16px 16px 0 0;
            }

            .wa-chatbot-launcher-btn {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }

            .wa-chatbot-header {
                padding: 12px;
            }

            .wa-chatbot-title {
                font-size: 14px;
            }

            .wa-chatbot-badge {
                display: none;
            }

            .wa-chatbot-messages {
                padding: 10px;
                gap: 8px;
            }
        }
    </style>
</head>

            // ===== DOM ELEMENTS =====
            const elements = {
                root: document.querySelector('.wa-chatbot-root'),
                launcher: document.querySelector('.wa-chatbot-launcher'),
                launcherBtn: document.getElementById('waLauncherBtn'),
                widget: document.getElementById('waChatbotWidget'),
                messages: document.getElementById('waChatMessages'),
                suggestions: document.getElementById('waSuggestions'),
                userInput: document.getElementById('waUserInput'),
                sendBtn: document.getElementById('waSendBtn'),
                killSwitchBtn: document.getElementById('waKillSwitchBtn')
            };

            // ===== STATE =====
            let isOpen = false;
            let isDisabled = false;

            // ===== UTILITY FUNCTIONS =====
            function getCurrentTime() {
                const now = new Date();
                return now.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: true
                });
            }

            function sanitizeHTML(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function scrollToBottom() {
                setTimeout(() => {
                    elements.messages.scrollTop = elements.messages.scrollHeight;
                }, 50);
            }

            // ===== WIDGET OPEN/CLOSE =====
            function openWidget() {
                if (isDisabled) return;
                isOpen = true;
                elements.widget.classList.add('wa-chatbot-open');
                elements.launcherBtn.setAttribute('aria-expanded', 'true');
                elements.launcher.style.display = 'none';
                localStorage.setItem(CONFIG.storageKeyOpen, 'true');
                elements.userInput.focus();
            }

            function closeWidget() {
                isOpen = false;
                elements.widget.classList.remove('wa-chatbot-open');
                elements.launcherBtn.setAttribute('aria-expanded', 'false');
                setTimeout(() => {
                    elements.launcher.style.display = '';
                }, 320);
                localStorage.removeItem(CONFIG.storageKeyOpen);
            }

                const content = document.createElement('div');
                content.className = 'wa-chatbot-message-content';

                const bubble = document.createElement('div');
                bubble.className = 'wa-chatbot-message-bubble';
                bubble.innerHTML = sanitizeHTML(text);

                const time = document.createElement('div');
                time.className = 'wa-chatbot-message-time';
                time.textContent = getCurrentTime();

            // ===== INTENT MATCHING =====
            function findBestMatch(userInput) {
                const input = userInput.toLowerCase().trim();

                for (const qa of KNOWLEDGE_BASE) {
                    for (const intent of qa.intents) {
                        if (input.includes(intent.toLowerCase())) {
                            return qa.response;
                        }
                    }
                }

                return null;
            }

            function getDefaultResponse() {
                return "Great question! I may not have that in this demo yet. For official information:\n\nMain: 920-356-2120\nAdmissions: 800-860-7725\n\nA real person can give you the best answer!";
            }

            // ===== USER INTERACTION =====
            function handleUserMessage() {
                if (isDisabled) return;

                const userText = elements.userInput.value.trim();
                if (!userText) return;

                addMessage(userText, true);
                elements.userInput.value = '';

                setTimeout(() => {
                    const response = findBestMatch(userText) || getDefaultResponse();
                    addMessage(response, false);
                }, 600);
            }

            function handleSuggestionClick(suggestionText) {
                elements.userInput.value = suggestionText;
                handleUserMessage();
            }

            // ===== KILL SWITCH =====
            function disableChatbot() {
                isDisabled = true;
                elements.widget.classList.add('wa-chatbot-disabled');
                localStorage.setItem(CONFIG.storageKeyDisabled, 'true');
            }

            function enableChatbot() {
                isDisabled = false;
                elements.widget.classList.remove('wa-chatbot-disabled');
                localStorage.removeItem(CONFIG.storageKeyDisabled);
            }

            function checkDisabledState() {
                if (localStorage.getItem(CONFIG.storageKeyDisabled) === 'true') {
                    disableChatbot();
                }
            }

            // ===== INITIALIZATION =====
            function renderSuggestions() {
                CONFIG.suggestedPrompts.forEach(prompt => {
                    const chip = document.createElement('button');
                    chip.className = 'wa-chatbot-suggestion-chip';
                    chip.textContent = prompt;
                    chip.setAttribute('aria-label', `Ask: ${prompt}`);
                    chip.addEventListener('click', () => handleSuggestionClick(prompt));
                    elements.suggestions.appendChild(chip);
                });
            }

            function showWelcomeMessage() {
                addMessage(
                    "Hi! 👋 I'm your Wayland Academy assistant. Ask me about our schedule, clubs, location, or anything else about campus life!"
                );
            }

            function attachEventListeners() {
                elements.launcherBtn.addEventListener('click', () => {
                    isOpen ? closeWidget() : openWidget();
                });

                elements.widget.addEventListener('click', (e) => {
                    e.stopPropagation();
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && isOpen) {
                        closeWidget();
                    }
                });

                elements.sendBtn.addEventListener('click', handleUserMessage);

                elements.userInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        handleUserMessage();
                    }
                });

                elements.killSwitchBtn.addEventListener('click', () => {
                    closeWidget();
                });
            }

            function restoreState() {
                if (localStorage.getItem(CONFIG.storageKeyOpen) === 'true' && !isDisabled) {
                    openWidget();
                }
            }

            function init() {
                checkDisabledState();
                renderSuggestions();
                attachEventListeners();
                showWelcomeMessage();
                restoreState();
            }

            // Launch when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
